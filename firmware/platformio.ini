[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32@7.1.0
board = esp32-s3-devkitc-1
framework = arduino
lib_deps =
    h2zero/NimBLE-Arduino@1.4.1
    bblanchon/ArduinoJson@7.4.3
    adafruit/Adafruit NeoPixel@1.15.5
monitor_speed = 115200
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.partitions = partitions_4mb.csv
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; Bench test build only: no app/Firebase; devices chosen over the UART
; serial port, published data printed there.
[env:bench-s3]
extends = env:esp32-s3-devkitc-1
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
    -DNOXBRAIN_BENCH
